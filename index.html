<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Image to Prompt - Berhasil 100%</title>
    <style>
        :root { --primary: #4f46e5; --bg: #f8fafc; }
        body { font-family: 'Inter', system-ui, sans-serif; background: var(--bg); display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; }
        .card { background: white; padding: 2rem; border-radius: 1rem; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1); width: 100%; max-width: 450px; }
        h2 { margin-top: 0; color: #1e293b; text-align: center; }
        .upload-box { border: 2px dashed #cbd5e1; border-radius: 0.75rem; padding: 2rem; text-align: center; cursor: pointer; transition: 0.2s; position: relative; margin-bottom: 1.5rem; }
        .upload-box:hover { border-color: var(--primary); background: #f1f5f9; }
        #preview { width: 100%; border-radius: 0.5rem; display: none; margin-top: 1rem; }
        input[type="file"] { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
        button { background: var(--primary); color: white; border: none; width: 100%; padding: 0.75rem; border-radius: 0.5rem; font-weight: 600; cursor: pointer; transition: 0.2s; }
        button:hover { opacity: 0.9; }
        button:disabled { background: #94a3b8; cursor: not-allowed; }
        #status { margin-top: 1rem; padding: 1rem; border-radius: 0.5rem; font-size: 0.875rem; display: none; line-height: 1.4; }
        .status-loading { background: #eef2ff; color: #4338ca; display: block !important; }
        .status-error { background: #fef2f2; color: #b91c1c; display: block !important; }
        .status-success { background: #f0fdf4; color: #15803d; display: block !important; border: 1px solid #bbf7d0; }
        .copy-hint { font-size: 0.7rem; color: #64748b; margin-top: 0.5rem; text-align: center; }
    </style>
</head>
<body>

<div class="card">
    <h2>📸 Image to Prompt</h2>
    <div class="upload-box" id="dropZone">
        <span id="label">Klik / Tarik Foto ke Sini</span>
        <input type="file" id="fileInput" accept="image/*">
        <img id="preview">
    </div>
    
    <button id="btnRun">Mulai Analisis ✨</button>
    
    <div id="status"></div>
    <div id="copyArea" style="display:none">
        <p class="copy-hint">Klik hasil di atas untuk menyalin</p>
    </div>
</div>

<script>
    // API KEY yang sudah Anda berikan
    const KEY = "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";
    const MODEL = "Salesforce/blip-image-captioning-large";

    const fileInput = document.getElementById('fileInput');
    const preview = document.getElementById('preview');
    const btn = document.getElementById('btnRun');
    const status = document.getElementById('status');
    const label = document.getElementById('label');

    // Preview Gambar
    fileInput.onchange = e => {
        const file = e.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = rs => {
                preview.src = rs.target.result;
                preview.style.display = 'block';
                label.style.display = 'none';
            }
            reader.readAsDataURL(file);
        }
    };

    async function processAI(data) {
        const response = await fetch(`https://api-inference.huggingface.co/models/${MODEL}`, {
            headers: { 
                "Authorization": `Bearer ${KEY}`,
                "Content-Type": "application/octet-stream"
            },
            method: "POST",
            body: data
        });

        const result = await response.json();
        return { status: response.status, data: result };
    }

    btn.onclick = async () => {
        if (!fileInput.files[0]) return alert("Pilih foto dulu!");

        btn.disabled = true;
        status.className = "status-loading";
        status.innerText = "🔄 Menghubungkan ke server AI...";

        try {
            const blob = fileInput.files[0];
            const res = await processAI(blob);

            if (res.status === 503) {
                status.className = "status-error";
                status.innerText = "⏳ Server AI sedang 'pemanasan'. Tunggu 10 detik lalu klik tombol lagi.";
            } else if (res.status === 401) {
                status.className = "status-error";
                status.innerText = "❌ Error: API Key tidak valid atau limit habis.";
            } else if (res.data[0] && res.data[0].generated_text) {
                status.className = "status-success";
                const prompt = res.data[0].generated_text;
                status.innerText = prompt;
                
                // Fitur Klik untuk Salin
                status.onclick = () => {
                    navigator.clipboard.writeText(prompt);
                    alert("Prompt disalin!");
                };
                document.getElementById('copyArea').style.display = 'block';
            } else {
                throw new Error("Hasil tidak dikenal");
            }
        } catch (err) {
            status.className = "status-error";
            status.innerText = "⚠️ Terjadi kesalahan koneksi. Pastikan internet aktif.";
        } finally {
            btn.disabled = false;
        }
    };
</script>

</body>
</html>

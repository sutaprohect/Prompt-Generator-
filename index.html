<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Image to Prompt - Fixed Version</title>
    <style>
        body { font-family: sans-serif; background: #f0f2f5; display: flex; justify-content: center; padding: 20px; }
        .box { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 450px; text-align: center; }
        .preview-img { width: 100%; border-radius: 8px; margin: 15px 0; display: none; border: 1px solid #ddd; }
        .btn { background: #007bff; color: white; border: none; padding: 12px 20px; border-radius: 6px; cursor: pointer; width: 100%; font-weight: bold; }
        .btn:disabled { background: #ccc; }
        #result { margin-top: 20px; padding: 15px; background: #f8f9fa; border-radius: 6px; text-align: left; word-wrap: break-word; font-size: 14px; border: 1px solid #eee; min-height: 40px; }
        .loader { color: #555; font-style: italic; display: none; }
    </style>
</head>
<body>

<div class="box">
    <h2>AI Image to Prompt</h2>
    <input type="file" id="fileInput" accept="image/*">
    <img id="imgPreview" class="preview-img">
    
    <button id="runBtn" class="btn">Proses Gambar Sekarang</button>
    
    <div id="loader" class="loader">Sedang memproses ke AI...</div>
    <div id="result">Hasil prompt akan muncul di sini...</div>
</div>

<script>
    // API KEY yang Anda berikan
    const API_KEY = "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";
    
    const fileInput = document.getElementById('fileInput');
    const imgPreview = document.getElementById('imgPreview');
    const runBtn = document.getElementById('runBtn');
    const resultDiv = document.getElementById('result');
    const loader = document.getElementById('loader');

    // Tampilkan gambar setelah dipilih
    fileInput.onchange = () => {
        const file = fileInput.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = e => {
                imgPreview.src = e.target.result;
                imgPreview.style.display = 'block';
            };
            reader.readAsDataURL(file);
        }
    };

    runBtn.onclick = async () => {
        const file = fileInput.files[0];
        if (!file) return alert("Pilih foto dulu!");

        // Reset tampilan
        resultDiv.innerText = "Menunggu jawaban...";
        loader.style.display = "block";
        runBtn.disabled = true;

        try {
            // Konversi file ke ArrayBuffer (format asli yang diminta Hugging Face)
            const imageData = await file.arrayBuffer();

            const response = await fetch(
                "https://api-inference.huggingface.co/models/Salesforce/blip-image-captioning-large",
                {
                    headers: { 
                        "Authorization": `Bearer ${API_KEY}`,
                        "Content-Type": "application/octet-stream"
                    },
                    method: "POST",
                    body: imageData,
                }
            );

            const data = await response.json();

            if (response.status === 503) {
                resultDiv.innerHTML = "<b>Status:</b> Server AI sedang dinyalakan (pemanasan). <br>Silakan <b>tunggu 10 detik</b> lalu klik tombol lagi.";
            } else if (data[0] && data[0].generated_text) {
                resultDiv.innerHTML = "<b>Hasil Prompt:</b><br>" + data[0].generated_text;
            } else if (data.error) {
                resultDiv.innerText = "Error dari AI: " + data.error;
            } else {
                resultDiv.innerText = "Gagal mendapatkan data. Coba lagi.";
            }

        } catch (err) {
            console.error(err);
            resultDiv.innerHTML = "<b style='color:red'>Kesalahan Koneksi!</b><br>Browser memblokir akses. <br><br><b>Solusi:</b> Buka file ini di browser <b>Firefox</b>, atau upload file ini ke <b>Netlify Drop</b> (gratis) agar bisa diakses via https.";
        } finally {
            loader.style.display = "none";
            runBtn.disabled = false;
        }
    };
</script>

</body>
</html>
